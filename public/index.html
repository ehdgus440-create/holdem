<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>친구끼리 홀덤</title>
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="친구홀덤">

<meta property="og:title" content="🃏 친구끼리 홀덤">
<meta property="og:description" content="로그인 없이 링크로 바로 입장! 최대 10명">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Cinzel:wght@700;900&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--felt:#0f5a3c;--felt2:#0a3f2a;--ink:#1d2330;--muted:#6c7486;--gold:#ffcc4d;--red:#e0344b;--line:#e7eaf0;--pri:#ff5a5f;--ok:#1fa66a}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:var(--felt2) radial-gradient(ellipse at 50% 0%,#17855a 0,#0a3f2a 70%) fixed;color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:12px 12px 90px}
h1,h2,h3,.jua,.banner,.codebox b,.pot{font-family:"Jua",sans-serif;font-weight:400}
h2{margin:0 0 8px;font-size:22px}h3{margin:0 0 8px;font-size:18px}
.hero{text-align:center;color:#fff;padding:18px 0 4px}
.hero h1{font-size:40px;margin:4px 0}
.hero p{opacity:.8;margin:0}
.logo{font-size:52px;letter-spacing:-6px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.28)}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px;color:var(--muted)}
label:first-child{margin-top:0}
input,select{width:100%;font-size:17px;padding:11px 12px;border:2px solid var(--line);border-radius:12px;outline:none;background:#f8fafc;color:var(--ink);font-family:inherit}
input:focus,select:focus{border-color:var(--pri)}
button{font:inherit;font-size:16px;border:0;border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:700;color:var(--ink);background:#eef1f5}
button:disabled{opacity:.4;cursor:default}
.primary{background:linear-gradient(135deg,#ff5a5f,#ff8a3d);color:#fff;width:100%;margin-top:12px;font-size:18px;padding:14px;box-shadow:0 4px 0 #c43d42}
.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #c43d42}
.row{display:flex;gap:8px;margin-top:8px;align-items:center}
.row>*{flex:1;min-width:0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.small{font-size:13px;padding:7px 10px}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--red);font-weight:700;font-size:14px;margin-top:8px}
details{margin-top:10px}summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:14px}
.rank{font-size:14px;line-height:1.7;margin:8px 0 0;padding-left:20px}
/* top bar */
.top{display:flex;align-items:center;gap:8px;color:#fff;margin-bottom:6px}
.top .t{flex:1;font-size:13px;opacity:.85}
.codebox{background:rgba(0,0,0,.25);border-radius:10px;padding:5px 10px;font-size:13px}
.codebox b{font-size:20px;letter-spacing:2px;color:var(--gold);margin-left:4px}
.topbtn{background:rgba(255,255,255,.15);color:#fff;font-size:13px;padding:7px 10px}
/* board */
.table{background:radial-gradient(ellipse at 50% 40%,#1a8a5c 0,#0f5a3c 75%);border:6px solid #5b3a1e;border-radius:26px;padding:14px 10px;text-align:center;color:#fff;box-shadow:inset 0 0 30px rgba(0,0,0,.4),0 10px 24px rgba(0,0,0,.35)}
.board{display:flex;justify-content:center;gap:5px;min-height:70px;align-items:center}
.pot{font-size:20px;color:var(--gold);margin-top:8px}
.street{font-size:12px;opacity:.75;margin-top:2px}
.pc{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:64px;background:#fff;border-radius:7px;color:#1d2330;font-weight:800;box-shadow:0 2px 4px rgba(0,0,0,.35);line-height:1;animation:pop .25s ease-out}
.pc .r{font-size:21px}.pc .s{font-size:19px;margin-top:2px}
.pc.red{color:var(--red)}
.pc.empty{background:rgba(255,255,255,.08);box-shadow:none;border:2px dashed rgba(255,255,255,.2);animation:none}
.pc.big{width:64px;height:90px;border-radius:10px}.pc.big .r{font-size:30px}.pc.big .s{font-size:26px}
.pc.mini{width:24px;height:33px;border-radius:4px;animation:none}.pc.mini .r{font-size:12px}.pc.mini .s{font-size:11px;margin-top:0}
.pc.back{background:repeating-linear-gradient(45deg,#c8323f 0 4px,#a82331 4px 8px);border:2px solid #fff}
.pc.win{outline:3px solid var(--gold)}
@keyframes pop{from{transform:scale(.6) rotateY(90deg);opacity:0}}
/* players */
.plist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);border-radius:14px;padding:7px 10px;position:relative;transition:transform .2s}
.pl.me{background:#fffbe8}
.pl.turn{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(255,204,77,.7);transform:scale(1.015)}
.pl.out{opacity:.5}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;color:#fff;font-family:"Jua",sans-serif}
.pinfo{flex:1;min-width:0}
.pname{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchips{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px;margin-left:3px;vertical-align:2px;color:#fff}
.tD{background:#1d2330}.tSB{background:#5b7cfa}.tBB{background:#8b5cf6}.tH{background:#ff8a3d}
.pstat{text-align:right;font-size:12px;font-weight:800;min-width:56px}
.bet{display:inline-block;background:var(--gold);color:#5a3d00;border-radius:10px;padding:2px 7px;font-size:12px}
.st-fold{color:#9aa1ad}.st-allin{color:var(--red)}.st-turn{color:#d18b00}
.pcards{display:flex;gap:2px}
.bubble{position:absolute;right:8px;top:-14px;background:#1d2330;color:#fff;font-size:13px;border-radius:12px;padding:3px 9px;animation:bub 3.5s forwards;pointer-events:none;white-space:nowrap;z-index:2}
@keyframes bub{0%{opacity:0;transform:translateY(6px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
/* my panel */
.mine{background:#fff;border-radius:18px;padding:12px;margin-top:12px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.mycards{display:flex;gap:8px;align-items:center}
.mystr{flex:1}
.mystr b{font-family:"Jua",sans-serif;font-weight:400;font-size:22px;display:block}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts button{padding:14px 6px;font-size:16px}
.bfold{background:#e9ecf1;color:#59606e}
.bcall{background:var(--ok);color:#fff;box-shadow:0 3px 0 #127a4b}
.braise{background:#ff8a3d;color:#fff;box-shadow:0 3px 0 #c9631f}
.ballin{background:var(--red);color:#fff;box-shadow:0 3px 0 #a81f33}
.raisebox{margin-top:10px;background:#f6f7fa;border-radius:12px;padding:10px}
.raisebox input[type=range]{padding:0;border:0;background:none;height:32px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.quick button{font-size:13px;padding:8px 2px;background:#fff;border:1.5px solid var(--line)}
.wait{text-align:center;color:var(--muted);font-weight:700;padding:10px 0 2px}
.emotes{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.emotes button{flex:none;font-size:13px;padding:7px 10px;background:rgba(255,255,255,.15);color:#fff}
.banner{border-radius:16px;padding:12px;text-align:center;font-size:21px;color:#fff;margin-top:12px;background:linear-gradient(135deg,#ffb300,#ff6f3d);box-shadow:0 6px 18px rgba(0,0,0,.3);animation:pop .35s}
.banner small{display:block;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:13px;opacity:.95;margin-top:4px;font-weight:700}
.log{margin-top:12px;color:#d9f3e6;font-size:12px;line-height:1.6;background:rgba(0,0,0,.2);border-radius:12px;padding:8px 10px;max-height:150px;overflow:auto}
.hostbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hostbar button{font-size:13px;padding:8px 10px;background:rgba(255,255,255,.92)}
.tbar{height:8px;background:#eef1f5;border-radius:6px;overflow:hidden;margin-top:10px}.tfill{height:100%;background:linear-gradient(90deg,#1fa66a,#ffcc4d,#e0344b);width:100%;transition:width .4s linear}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1d2330;color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.35);max-width:90vw;text-align:center;font-size:14px}
.lobbyp{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.lobbyp:last-child{border:0}
.sel{display:flex;gap:6px;flex-wrap:wrap}
.sel button{font-size:14px;padding:8px 12px;background:#f1f3f7}
.sel button.on{background:#1d2330;color:#fff}
.notice{background:#fff7e0;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55;color:#6b4f00}

/* ===== poker table ===== */
body{background:#0b0f14 radial-gradient(ellipse at 50% 30%,#22303a 0,#0b0f14 70%) fixed}
.tw{position:relative;width:100%;aspect-ratio:3/4;max-height:78vh;margin:34px auto 6px}.tw.s-lg{margin-top:58px}.tw.s-few{aspect-ratio:1/1.12}
.rail{position:absolute;left:9%;right:9%;top:7%;bottom:7%;border-radius:999px;background:linear-gradient(145deg,#7a4a24,#3e230f 60%,#5c3518);padding:12px;box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 2px 3px rgba(255,255,255,.25)}
.felt{position:relative;width:100%;height:100%;border-radius:999px;background:radial-gradient(ellipse at 50% 45%,#1f9e66 0,#137a4c 45%,#0b5534 100%);box-shadow:inset 0 0 0 3px rgba(255,215,120,.35),inset 0 0 40px rgba(0,0,0,.55)}
.feltlogo{position:absolute;left:0;right:0;top:22%;text-align:center;font-family:"Jua",sans-serif;color:rgba(255,255,255,.1);font-size:20px;letter-spacing:3px}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;width:92%}
.board{display:flex;justify-content:center;gap:3px;min-height:0}
.pc.bd{width:34px;height:48px;border-radius:5px}.pc.bd .r{font-size:16px}.pc.bd .s{font-size:14px;margin-top:1px}
.pc.bd.empty{border:1.5px dashed rgba(255,255,255,.22)}
.s-lg .pc.bd{width:40px;height:56px}.s-lg .pc.bd .r{font-size:19px}.s-lg .pc.bd .s{font-size:16px}
.pot{font-size:18px;color:#ffe08a;margin-top:6px;display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.3);padding:2px 12px;border-radius:20px}
.street{font-size:11px;opacity:.7;margin-top:3px;letter-spacing:1px}
.chipico{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#ffd54a 0 35%,#e0344b 36% 100%);border:2px dashed #fff;box-sizing:border-box;flex:none}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:70px;z-index:3;transition:opacity .2s}
.seat.out{opacity:.45}
.ring{width:42px;height:42px;border-radius:50%;padding:3px;background:#2b3440;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.seat .av{width:36px;height:36px;font-size:17px;border:2px solid rgba(255,255,255,.85)}
.seat.turn .ring{background:conic-gradient(#ffcc4d var(--p,100%),#2b3440 0);box-shadow:0 0 16px rgba(255,204,77,.8)}
.seat.won .ring{background:#ffcc4d;box-shadow:0 0 18px #ffcc4d}
.seat.me .ring{box-shadow:0 0 0 2px #fff,0 3px 8px rgba(0,0,0,.5)}
.plate{margin-top:-6px;background:rgba(10,14,20,.88);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:2px 6px;text-align:center;min-width:58px;max-width:74px;z-index:1}
.sn{color:#fff;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{color:#ffe08a;font-size:11px;font-weight:800}
.ss{font-size:10px;color:#cfe;font-weight:800;margin-top:1px;min-height:12px;text-shadow:0 1px 2px #000}
.ss .ai{color:#ff6b7d}.ss .wn{color:#7dffb3;font-size:12px}
.hn{font-size:10px;background:#ffcc4d;color:#4a3300;border-radius:6px;padding:0 5px;font-weight:800;white-space:nowrap}
.scards{display:flex;gap:1px;margin-bottom:-10px;z-index:0}
.scards .pc.mini{width:22px;height:31px}
.scards .pc.back{border-width:1.5px}
.sbet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:3px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;font-weight:800;padding:1px 7px 1px 3px;border-radius:12px;z-index:2;white-space:nowrap}
.dbtn{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:#fff;color:#111;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.5);z-index:2}
.s-lg .seat{width:84px}.s-lg .ring{width:52px;height:52px}.s-lg .seat .av{width:45px;height:45px;font-size:21px}.s-lg .sn,.s-lg .sc{font-size:12px}
.s-lg .scards .pc.mini{width:28px;height:39px}.s-lg .scards .pc.mini .r{font-size:14px}
.s-sm .seat{width:60px}.s-sm .ring{width:36px;height:36px}.s-sm .seat .av{width:30px;height:30px;font-size:14px}.s-sm .plate{min-width:50px;max-width:62px;padding:1px 4px}.s-sm .sn,.s-sm .sc{font-size:10px}
.s-sm .scards .pc.mini{width:18px;height:26px}.s-sm .scards .pc.mini .r{font-size:10px}.s-sm .scards .pc.mini .s{font-size:9px}
.seat .bubble{right:auto;left:50%;transform:translateX(-50%);top:-22px;animation:bub2 3.5s forwards}
@keyframes bub2{0%{opacity:0;margin-top:6px}10%,80%{opacity:1;margin-top:0}100%{opacity:0}}
.mine{background:linear-gradient(180deg,#1b2430,#121820);color:#fff;border:1px solid rgba(255,255,255,.1)}
.mine .muted,.mine .wait{color:#a9b4c2}
.mine .raisebox{background:rgba(255,255,255,.06)}
.mine .quick button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff}
.mine .bfold{background:#3a4553;color:#e6ebf1}
.mine .small{background:rgba(255,255,255,.1);color:#fff}
.mine .tbar{background:rgba(255,255,255,.1)}
.top{margin-bottom:0}
.la{display:inline-block;font-size:11px;font-weight:900;padding:1px 7px;border-radius:9px;color:#fff;white-space:nowrap;text-shadow:none;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.la-check{background:#5b7cfa}.la-call{background:#1fa66a}.la-bet,.la-raise{background:#ff8a3d}.la-allin{background:#e0344b}.la-fold{background:#59606e}.la-blind{background:#3a4553}.la-turn{background:#ffcc4d;color:#4a3300}
.la-new{animation:lapop .5s ease-out}
@keyframes lapop{0%{transform:scale(1.8);opacity:0}60%{transform:scale(.9)}100%{transform:none;opacity:1}}
.s-sm .la{font-size:10px;padding:0 5px}
.ss{min-height:16px;margin-top:2px}
.ring{position:relative}
.rb{position:absolute;right:-6px;top:-4px;background:#e0344b;color:#fff;font-size:9px;font-weight:900;border-radius:8px;padding:1px 4px;border:1.5px solid #fff;line-height:1.2;z-index:2}
.stats{background:#fff;border-radius:16px;padding:12px;margin-top:12px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sgrid div{background:#f3f5f9;border-radius:10px;padding:8px;text-align:center}
.sgrid span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.sgrid b{font-size:15px}
.stats table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.stats th{font-size:11px;color:var(--muted);text-align:right;padding:4px;border-bottom:1px solid var(--line)}
.stats td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.stats th:nth-child(-n+2),.stats td:nth-child(-n+2){text-align:left}
.stats .nmc{font-weight:700;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats .pos{color:#1fa66a;font-weight:800}.stats .neg{color:#e0344b;font-weight:800}
.stats .meRow{background:#fffbe8}
.rb2{background:#e0344b;color:#fff;border-radius:8px;padding:1px 6px;font-size:11px;font-weight:800}
.bigcode{display:flex;flex-direction:column;align-items:center;background:#1d2330;color:#fff;border-radius:14px;padding:10px;margin:4px 0 8px;cursor:pointer;user-select:all}
.bigcode span{font-size:12px;opacity:.7}.bigcode b{font-family:"Jua",sans-serif;font-weight:400;font-size:40px;letter-spacing:8px;color:var(--gold);line-height:1.1}.bigcode em{font-style:normal;font-size:12px;opacity:.8}
.bigcode:active{transform:scale(.98)}
.stats .sel button.on{background:#1d2330;color:#fff}
.netst{color:#fff;font-size:13px;font-weight:700;text-align:center;background:rgba(0,0,0,.3);border-radius:10px;padding:7px;margin-top:10px}
.tw{margin-bottom:48px!important}
.top{flex-wrap:wrap;row-gap:4px}.top .t{order:5;flex-basis:100%;font-size:12px;line-height:1.4}.top .t br{display:none}.top .t .bsep::before{content:' · '}.top .codebox{flex:1}
/* ================= LUXURY THEME ================= */
:root{--gold1:#fff3c4;--gold2:#f5d27a;--gold3:#d4a63c;--gold4:#9c7420;--goldg:linear-gradient(135deg,#fff3c4 0%,#f5d27a 22%,#c9962e 48%,#f7dc8c 70%,#a87a22 100%);--ink:#f3e9d2;--muted:#b9ab8c;--line:rgba(245,210,122,.22);--panel:linear-gradient(160deg,rgba(28,24,18,.92),rgba(10,9,8,.94))}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:#07070a;background-image:radial-gradient(ellipse at 50% -10%,rgba(212,166,60,.28),transparent 55%),radial-gradient(ellipse at 100% 100%,rgba(120,20,40,.35),transparent 50%),radial-gradient(ellipse at 0% 80%,rgba(20,70,60,.35),transparent 50%),linear-gradient(#0b0a0d,#050507);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,230,160,.9),transparent),radial-gradient(1px 1px at 78% 12%,rgba(255,230,160,.8),transparent),radial-gradient(1.5px 1.5px at 33% 66%,rgba(255,230,160,.7),transparent),radial-gradient(1px 1px at 88% 58%,rgba(255,230,160,.8),transparent),radial-gradient(1.2px 1.2px at 55% 30%,rgba(255,230,160,.6),transparent),radial-gradient(1px 1px at 20% 90%,rgba(255,230,160,.7),transparent),radial-gradient(1.4px 1.4px at 65% 85%,rgba(255,230,160,.7),transparent);animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
#app{position:relative;z-index:1}
h1,h2,h3,.jua,.banner,.codebox b,.pot,.lux{font-family:"Cinzel","Black Han Sans",serif;font-weight:700}
h2,h3{color:var(--gold2);letter-spacing:.5px}
/* hero */
.hero{padding:26px 0 8px}
.hero .logo{font-size:0;height:64px;position:relative;letter-spacing:0}
.hero .logo::before{content:"♠ ♥ ♦ ♣";font-size:34px;letter-spacing:6px;background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px rgba(212,166,60,.5))}
.hero h1{font-size:42px;line-height:1.05;margin:2px 0 8px;background:linear-gradient(110deg,#a87a22 0%,#f7dc8c 20%,#fff6d6 30%,#d4a63c 45%,#f5d27a 65%,#a87a22 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 3px 14px rgba(212,166,60,.35))}

<body>
<div id="app"><div class="hero"><div class="logo">🂡🂮</div><h1>친구끼리 홀덤</h1><p>불러오는 중…</p></div></div>
<div id="toast" class="toast" style="display:none"></div>
<script>
//ENGINE-START
const RK='23456789TJQKA';
const HN=['하이카드','원페어','투페어','트리플','스트레이트','플러시','풀하우스','포카드','스트레이트 플러시'];
function rv(c){return RK.indexOf(c[0])+2}
function eval5(cs){
  const r=cs.map(rv).sort((a,b)=>b-a),fl=cs.every(c=>c[1]===cs[0][1]);
  let st=0;
  if(new Set(r).size===5){if(r[0]-r[4]===4)st=r[0];else if(r[0]===14&&r[1]===5)st=5}
  const cnt={};r.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  const g=Object.entries(cnt).map(([k,v])=>[v,+k]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  let cat,k;
  if(st&&fl){cat=8;k=[st]}
  else if(g[0][0]===4){cat=7;k=[g[0][1],g[1][1]]}
  else if(g[0][0]===3&&g[1][0]===2){cat=6;k=[g[0][1],g[1][1]]}
  else if(fl){cat=5;k=r}
  else if(st){cat=4;k=[st]}
  else if(g[0][0]===3){cat=3;k=g.map(x=>x[1])}
  else if(g[0][0]===2&&g[1][0]===2){cat=2;k=g.map(x=>x[1])}
  else if(g[0][0]===2){cat=1;k=g.map(x=>x[1])}
  else{cat=0;k=r}
  let s=cat;for(let i=0;i<5;i++)s=s*15+(k[i]||0);
  return s;
}
function best(cs){
  const n=cs.length;if(n<5)return -1;let b=-1;const idx=[];
  (function rec(s){if(idx.length===5){const v=eval5(idx.map(i=>cs[i]));if(v>b)b=v;return}
    for(let i=s;i<n;i++){idx.push(i);rec(i+1);idx.pop()}})(0);
  return b;
}
function handName(s){const c=Math.floor(s/15**5);if(c===8&&Math.floor(s/15**4)%15===14)return '로열 플러시';return HN[c]}
function nextIn(list,from,pred){const n=list.length,i=list.indexOf(from);for(let k=1;k<=n;k++){const u=list[(i+k+n)%n];if(pred(u))return u}return null}
function pay(r,u,amt){const H=r.hand,p=H.ps[u],pl=r.players[u];const x=Math.max(0,Math.min(amt,pl.chips));pl.chips-=x;p.bet+=x;p.total+=x;if(pl.chips===0)p.allin=true;return x}
function hlog(H,s){H.log.push(s);if(H.log.length>40)H.log.splice(0,H.log.length-40)}
const TURN_MS=15000;
const MAX_BB=100000;
function levelBB(r,lv){const s=r.settings;return Math.min(s.bb*2**lv,s.maxBb||MAX_BB)}
function blindLevel(r,now){const m=+r.settings.upMin||0;if(!m||!r.startedAt)return 0;return Math.max(0,Math.floor((now-r.startedAt)/(m*60000)))}
function timeoutAct(r,priv,u){const H=r.hand;if(!H||H.street==='done'||H.toAct!==u)return;
  const ps=H.ps[u],t=H.curBet-ps.bet>0?'fold':'check';applyAction(r,priv,u,{type:t,n:H.n});
  H.log[H.log.length-1]+=' ⏰ 시간 초과';}
function canPlay(r,u){const p=r.players[u];return p&&!p.sitOut&&!p.left&&p.chips>0}
function startHand(r,deck){
  const elig=r.order.filter(u=>canPlay(r,u));
  if(elig.length<2)return null;
  const prev=r.hand&&r.hand.dealer;
  const dealer=prev?nextIn(r.order,prev,u=>elig.includes(u)):elig[0];
  const n=(r.handNo||0)+1;r.handNo=n;
  const lv=blindLevel(r,Date.now());
  const bbA=levelBB(r,lv),sbA=bbA/2;
  const seats=elig,ps={};
  seats.forEach(u=>ps[u]={bet:0,total:0,folded:false,allin:false,acted:false});
  const H={n,dealer,seats,ps,board:[],street:'pre',curBet:0,minRaise:bbA,sbA,bbA,toAct:null,shown:{},result:null,log:[],turnAt:Date.now()};
  let sb,bb;
  if(seats.length===2){sb=dealer;bb=nextIn(seats,dealer,()=>true)}
  else{sb=nextIn(seats,dealer,()=>true);bb=nextIn(seats,sb,()=>true)}
  H.sb=sb;H.bb=bb;r.hand=H;
  const holes={};seats.forEach(u=>holes[u]=[deck.pop(),deck.pop()]);
  hlog(H,`— ${n}번째 판 (블라인드 ${sbA}/${bbA}) —`);
  pay(r,sb,sbA);pay(r,bb,bbA);
  ps[sb].la={k:'blind',t:'SB',v:ps[sb].bet};ps[bb].la={k:'blind',t:'BB',v:ps[bb].bet};
  H.curBet=Math.max(...seats.map(u=>ps[u].bet));
  const priv={n,deck,holes};
  progress(r,priv,bb);
  return priv;
}
function roundDone(H){
  const act=H.seats.filter(u=>!H.ps[u].folded);if(act.length<=1)return true;
  const can=act.filter(u=>!H.ps[u].allin);
  if(can.length===0)return true;
  if(can.length===1&&H.ps[can[0]].bet>=H.curBet)return true;
  return can.every(u=>H.ps[u].acted&&H.ps[u].bet===H.curBet);
}
function nextToAct(H,from){return nextIn(H.seats,from,u=>{const p=H.ps[u];return !p.folded&&!p.allin&&(!p.acted||p.bet<H.curBet)})}
function nextStreet(H,priv){
  H.seats.forEach(u=>{const q=H.ps[u];q.bet=0;q.acted=false;if(!q.folded&&!q.allin)delete q.la});
  H.curBet=0;H.minRaise=H.bbA;
  priv.deck.pop();
  const k=H.street==='pre'?3:1;for(let i=0;i<k;i++)H.board.push(priv.deck.pop());
  H.street={pre:'flop',flop:'turn',turn:'river'}[H.street];
}
function progress(r,priv,last){
  const H=r.hand,act=H.seats.filter(u=>!H.ps[u].folded);
  if(act.length===1)return settle(r,priv,false);
  if(!roundDone(H)){H.toAct=nextToAct(H,last);H.turnAt=Date.now();return}
  for(;;){
    if(H.street==='river')return settle(r,priv,true);
    nextStreet(H,priv);
    const can=act.filter(u=>!H.ps[u].allin);
    if(can.length>=2){H.toAct=nextToAct(H,H.dealer);H.turnAt=Date.now();return}
  }
}
function applyAction(r,priv,u,a){
  const H=r.hand;
  if(!H||H.street==='done')return '진행 중인 판이 없어요';
  if(a.n!==H.n)return '지난 판의 액션이에요';
  if(H.toAct!==u)return '내 차례가 아니에요';
  const p=H.ps[u],pl=r.players[u],toCall=H.curBet-p.bet;let msg;
  let la;
  if(a.type==='fold'){p.folded=true;msg='폴드';la={k:'fold',t:'폴드'}}
  else if(a.type==='check'){if(toCall>0)return '체크할 수 없어요';msg='체크';la={k:'check',t:'체크'}}
  else if(a.type==='call'){
    if(toCall<=0){msg='체크';la={k:'check',t:'체크'}}
    else{const x=pay(r,u,toCall);msg=p.allin?`올인 콜 (${x})`:`콜 ${x}`;la=p.allin?{k:'allin',t:'올인',v:p.bet}:{k:'call',t:'콜',v:x}}
  }else if(a.type==='raise'||a.type==='allin'){
    const max=p.bet+pl.chips;let to=a.type==='allin'?max:Math.floor(+a.to||0);
    if(to>=max)to=max;
    else{const min=H.curBet+H.minRaise;if(to<min)return `최소 ${min}까지 올려야 해요`}
    if(to<=H.curBet){pay(r,u,to-p.bet);msg=`올인 (${to})`;la={k:'allin',t:'올인',v:to}}
    else{
      const inc=to-H.curBet;if(inc>=H.minRaise)H.minRaise=inc;
      const wasBet=H.curBet===0;pay(r,u,to-p.bet);H.curBet=to;
      H.seats.forEach(v=>{if(v!==u)H.ps[v].acted=false});
      msg=p.allin?`올인!! (${to})`:(wasBet?`벳 ${to}`:`레이즈 → ${to}`);
      la=p.allin?{k:'allin',t:'올인',v:to}:wasBet?{k:'bet',t:'벳',v:to}:{k:'raise',t:'레이즈',v:to};
    }
  }else return '알 수 없는 액션';
  p.acted=true;p.la=Object.assign(la,{at:Date.now()});hlog(H,`${pl.name}: ${msg}`);
  progress(r,priv,u);
  return null;
}
function forceFold(r,priv,u,why){
  const H=r.hand;if(!H||H.street==='done'||!H.ps[u]||H.ps[u].folded)return;
  if(H.toAct===u){applyAction(r,priv,u,{type:'fold',n:H.n});return}
  H.ps[u].folded=true;H.ps[u].la={k:'fold',t:'폴드',at:Date.now()};hlog(H,`${r.players[u].name}: 폴드 (${why||'자리 비움'})`);
  const act=H.seats.filter(v=>!H.ps[v].folded);
  if(act.length===1)settle(r,priv,false);
  else if(roundDone(H))progress(r,priv,H.toAct);
}
function settle(r,priv,show){
  const H=r.hand,ps=H.ps,act=H.seats.filter(u=>!ps[u].folded);
  const levels=[...new Set(H.seats.map(u=>ps[u].total).filter(x=>x>0))].sort((a,b)=>a-b);
  let prev=0;const pots=[];
  for(const L of levels){
    let amt=0;H.seats.forEach(u=>amt+=Math.max(0,Math.min(ps[u].total,L)-prev));
    const el=act.filter(u=>ps[u].total>=L);prev=L;if(!amt)continue;
    const last=pots[pots.length-1];
    if(!el.length||(last&&last.el.join()===el.join())){if(last)last.amt+=amt;else pots.push({amt,el:act.slice()})}
    else pots.push({amt,el});
  }
  const score={};if(show)act.forEach(u=>score[u]=best(priv.holes[u].concat(H.board)));
  const won={},res=[];
  for(const P of pots){
    let w;
    if(!show)w=[act[0]];
    else{const m=Math.max(...P.el.map(u=>score[u]));w=P.el.filter(u=>score[u]===m)}
    const ord=[];let c=H.dealer;
    for(let i=0;i<H.seats.length;i++){c=nextIn(H.seats,c,()=>true);if(w.includes(c))ord.push(c)}
    const share=Math.floor(P.amt/ord.length);let rem=P.amt-share*ord.length;
    ord.forEach(u=>{const g=share+(rem>0?1:0);if(rem>0)rem--;won[u]=(won[u]||0)+g;r.players[u].chips+=g});
    res.push({amt:P.amt,w:ord,hand:show?handName(score[ord[0]]):null,solo:P.el.length===1});
  }
  const names={};
  if(show)act.forEach(u=>{H.shown[u]=priv.holes[u];names[u]=handName(score[u])});
  H.result={pots:res,won,show,names};
  H.street='done';H.toAct=null;H.doneAt=Date.now();
  Object.keys(won).forEach(u=>hlog(H,`🏆 ${r.players[u].name} +${won[u]}${show?` (${names[u]})`:''}`));
}
function voidHand(r){
  const H=r.hand;if(!H||H.street==='done')return;
  H.seats.forEach(u=>{r.players[u].chips+=H.ps[u].total});
  H.street='done';H.toAct=null;H.result={void:true,pots:[],won:{}};H.doneAt=Date.now();
  hlog(H,'⚠️ 이번 판은 무효 처리됐어요 (칩 환불)');
}
//ENGINE-END

/* ================= app ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n||0).toLocaleString('ko-KR');
const COLORS=['#ff5a5f','#5b7cfa','#1fa66a','#ff8a3d','#8b5cf6','#00a3c4','#e0446f','#a87b00','#3d5a80','#c2410c','#0f766e','#9333ea','#be123c','#4d7c0f','#475569'];
const EMO=['🤔 고민중','😏 블러핑이지?','🔥 올인 각','🙏 제발…','😭 망했다','👏 나이스','🤡 낚였다','🐟 호구 등장'];
const S={me:null,name:'',code:null,room:null,loaded:false,keys:null,my:{n:0,cards:null},raise:0,view:'home',err:'',subs:[],bubbles:{},pendingAt:0,showRules:false};
let HR=null,HP=null,lastPJ=null,hostQ=Promise.resolve(),wChain=Promise.resolve();
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function toast(m,ms){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',ms||2600)}
function R(){return S.practice&&HR?HR:S.room}
function isHost(){return S.room&&S.room.host===S.me}
function nm(u){const r=R();return (r&&r.players[u]&&r.players[u].name)||'?'}
function colorOf(u){const r=R();const i=r?r.order.indexOf(u):0;return COLORS[(i<0?0:i)%COLORS.length]}
function randInt(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function newDeck(){const d=[];for(const s of 'shdc')for(const r of RK)d.push(r+s);for(let i=d.length-1;i>0;i--){const j=randInt(i+1);[d[i],d[j]]=[d[j],d[i]]}return d}
function clone(o){return JSON.parse(JSON.stringify(o))}

/* ---- 서버 연결 (WebSocket) ---- */
S.me=ls('h_id')||('p'+Math.random().toString(36).slice(2,12)+Date.now().toString(36));ls('h_id',S.me);
S.net='connecting';S.skew=0;
function send(m){try{if(S.ws&&S.ws.readyState===1){S.ws.send(JSON.stringify(m));return true}}catch(e){}return false}
// 무료 서버는 15분간 들어오는 메시지가 없으면 잠들어서 방이 사라져요 → 열려 있는 동안 40초마다 신호 보내기
setInterval(()=>{if(S.net==='on')send({t:'ping'})},40000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.net==='on')send({t:'ping'});if(!document.hidden&&S.net==='off')wsConnect()});
function wsConnect(){
  if(S.ws&&(S.ws.readyState===0||S.ws.readyState===1))return;
  let ws;try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws')}catch(e){S.net='off';render();return}
  S.ws=ws;S.net='connecting';

function hostHandle(u,a){

const BOT_NAMES=['게스트','게스트2','게스트3','게스트4','게스트5','게스트6','게스트7','게스트8','게스트9','게스트10'];
const BOT_TALK=['😏 블러핑이지?','🤔 고민중','🔥 올인 각','👏 나이스','🐟 호구 등장','😭 망했다'];
function localBubble(u,m){const t=Date.now();S.bubbles[u]={m,t};render();setTimeout(()=>{if(S.bubbles[u]&&S.bubbles[u].t===t){delete S.bubbles[u];render()}},3500)}

  HR.players[S.me]={name:S.name,chips:st.chips,rebuys:0,sitOut:false,left:false};HR.order.push(S.me);

function scheduleBot(){
  clearTimeout(S.botT);const H=HR&&HR.hand;
  if(!S.practice||!H||H.street==='done'||!H.toAct||!HR.players[H.toAct].bot)return;
  const u=H.toAct,key=H.n+':'+u+':'+H.turnAt;
  S.botT=setTimeout(()=>hq(()=>{
    const h=HR&&HR.hand;if(!h||h.street==='done'||h.n+':'+h.toAct+':'+h.turnAt!==key)return;
    const a=botDecide(HR,HP,u);a.n=h.n;
    if(applyAction(HR,HP,u,a))applyAction(HR,HP,u,{type:h.curBet>h.ps[u].bet?'call':'check',n:h.n});
    if((a.type==='allin'||a.type==='raise')&&Math.random()<.25)localBubble(u,a.type==='allin'?'🔥 올인 각':'😏 따라올 수 있어?');
    commit();
  }),900+Math.random()*1800);
}
function botDecide(r,priv,u){
  const H=r.hand,ps=H.ps[u],hole=priv.holes[u],toCall=H.curBet-ps.bet;
  const pot=H.seats.reduce((a,v)=>a+H.ps[v].total,0);
  let str;
  if(!H.board.length){const [a,b]=hole.map(rv).sort((x,y)=>y-x);
    str=a===b?.55+a/35:(a+b)/40+(hole[0][1]===hole[1][1]?.06:0)+(a-b<=2?.04:0)-.1}
  else{const sc=best(hole.concat(H.board)),cat=Math.floor(sc/15**5);
    str=[.15,.45,.68,.8,.88,.9,.95,.98,1][cat];
    if(cat===1){const pr=Math.floor(sc/15**4)%15,hi=Math.max(...H.board.map(rv));str=pr>=hi?.58:.36}
    if(H.board.length===5&&Math.floor(best(H.board)/15**5)>=cat)str=Math.min(str,.3)}
  str+=(Math.random()-.5)*.15;
  const x=Math.random(),bet=f=>({type:'raise',to:Math.round(H.curBet+Math.max(H.minRaise,(pot+toCall)*f))});
  if(toCall<=0){
    if(str>.7)return x<.25&&str>.92?{type:'allin'}:bet(.5+Math.random()*.5);
    if(x<.18)return bet(.5);
    return {type:'check'}}
  const odds=toCall/(pot+toCall);
  if(str>.85&&x<.6)return x<.15?{type:'allin'}:bet(.7);
  if(str>odds+.15||x<.08)return {type:'call'};
  if(str<.3&&x<.05)return bet(1);
  return {type:'fold'};
}

const VSTYLE={basic:{l:'🙂 기본',p:1,r:1.1},dealer:{l:'🎩 딜러',p:.75,r:.95},cute:{l:'🐥 귀엽게',p:1.8,r:1.15},deep:{l:'🐻 굵게',p:.4,r:.95},fast:{l:'⚡ 빠르게',p:1,r:1.6},slow:{l:'🐢 천천히',p:1,r:.8}};

/* TTS가 있으면 음성, 없거나 소리가 안 나는 환경이면 효과음으로 안내 */
let AC=null;
function audioUnlock(){
  try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state!=='running')AC.resume()}catch(e){}
  try{const ss=window.speechSynthesis;if(ss){ss.cancel();ss.resume&&ss.resume()}}catch(e){}

function sfx(kind){
  if(!S.voice||!AC)return;try{if(AC.state!=='running')AC.resume()}catch(e){}
  const seq={turn:[[880,.12],[1320,.18]],chip:[[2400,.03],[1800,.04]],win:[[523,.1],[659,.1],[784,.1],[1047,.25]],warn:[[660,.08],[0,.06],[660,.08]],deal:[[1200,.05]]}[kind];if(!seq)return;
  try{let t=AC.currentTime+.01;for(const [f,d] of seq){if(f){const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='chip'?'triangle':'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(kind==='chip'?.25:.35,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}t+=d}}catch(e){}
}
function ttsOK(){return !!(window.speechSynthesis&&window.SpeechSynthesisUtterance)&&!S.ttsBroken}
function speak(t,force){
  if(!t||(!S.voice&&!force)||!ttsOK())return;const ss=window.speechSynthesis;
  try{if(ss.speaking||ss.pending){if(++S.vq>3){ss.cancel();S.vq=0}}else S.vq=0;
    const u=new SpeechSynthesisUtterance(t);const st=VSTYLE[S.vstyle]||VSTYLE.basic;u.lang='ko-KR';u.rate=st.r;u.pitch=st.p;u.volume=1;const v=koVoice();try{if(v)u.voice=v}catch(e){}
    if(!S.ttsChecked){S.ttsChecked=true;let started=false;u.onstart=()=>{started=true;S.ttsWorks=true};
      setTimeout(()=>{if(!started&&!S.ttsWorks){S.ttsBroken=true;ttsFailNotice()}},2500)}
    else u.onstart=()=>{S.ttsWorks=true};
    ss.speak(u);if(ss.resume)ss.resume();
  }catch(e){S.ttsBroken=true;ttsFailNotice()}
}

document.addEventListener('pointerdown',()=>{if(S.voice&&!S.vUnlocked){S.vUnlocked=true;audioUnlock();try{if(ttsOK()){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}}},true);
function voiceAct(l){return {fold:'폴드',check:'체크',call:'콜 '+l.v,bet:'벳 '+l.v,raise:'레이즈 '+l.v,allin:'올인!'}[l.k]||''}
function voiceCheck(){
  if(!S.voice||S.view!=='room'){S.vp=null;return}
  const r=R(),H=r&&r.hand;if(!H){S.vp=null;return}
  const cur={n:H.n,street:H.street,toAct:H.toAct,turnAt:H.turnAt,bb:H.bbA,la:{}};
  H.seats.forEach(u=>{const l=H.ps[u].la;cur.la[u]=l?l.k+':'+(l.v||0)+':'+(l.at||0):''});
  const p=S.vp;S.vp=cur;if(!p)return;
  const say=[];
  if(p.n!==H.n){say.push(H.n+'번째 판 시작');if(p.bb&&H.bbA>p.bb)say.push('블라인드가 '+H.sbA+', '+H.bbA+'으로 올랐어요')}

  if(p.n===H.n&&p.street!==H.street&&H.street!=='done')say.push({flop:'플랍',turn:'턴',river:'리버'}[H.street]);
  if(H.street==='done'&&(p.street!=='done'||p.n!==H.n)&&H.result){
    const res=H.result;
    if(res.void)say.push('이번 판은 무효예요');
    else{const ws=Object.keys(res.won||{});const main=(res.pots||[]).find(x=>!x.solo)||res.pots[0];
      if(main&&main.w.length>1)say.push('무승부! 팟을 나눠 가져요');
      else ws.slice(0,2).forEach(w=>say.push((w===S.me?'내가':nm(w).replace(' 🤖','')+'님')+' 승리! '+(res.show&&res.names[w]?res.names[w]:'')))}

/* 차례/베팅 갱신 시 게임판 전체 innerHTML 교체를 피함.
   카드 노드를 재사용해 불필요한 재등장·깜빡임을 막습니다. */
function gameNodeKey(node){
  if(node&&node.nodeType===1){for(const name of ['data-seat','data-bet','data-dealer']){const v=node.getAttribute(name);if(v!==null)return name+':'+v;}}
  return null;
}
function sameGameNode(a,b){
  return a&&b&&a.nodeType===b.nodeType&&(a.nodeType!==1||a.tagName===b.tagName);
}
function patchGameNode(oldNode,newNode){
  if(oldNode.nodeType!==1){
    if(oldNode.nodeValue!==newNode.nodeValue)oldNode.nodeValue=newNode.nodeValue;
    return;
  }
  for(const a of Array.from(oldNode.attributes)){
    if(!newNode.hasAttribute(a.name))oldNode.removeAttribute(a.name);
  }
  for(const a of Array.from(newNode.attributes)){
    if(oldNode.getAttribute(a.name)!==a.value)oldNode.setAttribute(a.name,a.value);
  }
  if(oldNode.tagName==='INPUT'&&document.activeElement!==oldNode){
    if(oldNode.type==='checkbox'||oldNode.type==='radio')oldNode.checked=newNode.checked;
    else if(oldNode.value!==newNode.value)oldNode.value=newNode.value;
  }
  patchGameChildren(oldNode,newNode);
}
function patchGameChildren(parent,wanted){
  let cursor=parent.firstChild;
  for(const desired of Array.from(wanted.childNodes)){
    const key=gameNodeKey(desired);
    let match=null;
    if(key){
      for(let n=cursor;n;n=n.nextSibling){
        if(gameNodeKey(n)===key&&sameGameNode(n,desired)){match=n;break}
      }
    }else if(cursor&&!gameNodeKey(cursor)&&sameGameNode(cursor,desired)){
      match=cursor;
    }
    if(match){
      if(match!==cursor)parent.insertBefore(match,cursor);
      patchGameNode(match,desired);
      cursor=match.nextSibling;
    }else{
      const node=desired.cloneNode(true);
      parent.insertBefore(node,cursor);
    }
  }
  while(cursor){
    const next=cursor.nextSibling;
    parent.removeChild(cursor);
    cursor=next;
  }
}
function patchGameMarkup(app,html){
  const next=document.createElement('template');

  const vs=koVoices(),cur=koVoice();
  const vb=vs.length?vs.map(v=>`<button class="${cur&&cur.name===v.name?'on':''}" data-vname="${esc(v.name)}">${esc(v.name.replace(/Microsoft |Google |\(.*\)| Online| Natural|Korean|한국어/g,'').trim()||v.name)}</button>`).join('')
    :`<p class="muted" style="margin:0">이 기기에서 쓸 수 있는 한국어 목소리가 없어요. 크롬·사파리에서 열거나, 폰 설정 → 텍스트 음성 변환(TTS)에서 한국어 음성을 받으면 여기에 나타나요.</p>`;
  return `<div class="stats"><div class="row" style="margin:0 0 6px"><h3 style="margin:0;flex:1">🎙 목소리 바꾸기</h3><button class="small" data-act="voicepanel">닫기</button></div>
    <label style="margin-top:4px">목소리 (이 폰에 있는 한국어 음성 ${vs.length}개)</label><div class="sel">${vb}</div>
    <label>말투</label><div class="sel">${Object.entries(VSTYLE).map(([k,v])=>`<button class="${S.vstyle===k?'on':''}" data-vstyle="${k}">${v.l}</button>`).join('')}</div>
    <p class="muted" style="margin:8px 0 0">누르면 바로 미리 들려줘요. 설정은 이 폰에 저장되고, 내 화면에서만 바뀌어요.</p>
    <div class="row"><button class="small" data-act="vtest">🔈 소리 테스트</button></div></div>`;
}
function statsPanel(r,H){
  const pot=H&&H.street!=='done'?H.seats.reduce((a,u)=>a+H.ps[u].total,0):0;
  const ids=r.order.filter(u=>!r.players[u].left||r.players[u].chips>0||r.players[u].rebuys);
  const stack=u=>r.players[u].chips+(H&&H.street!=='done'&&H.ps[u]?H.ps[u].total:0);
  const buyin=u=>r.settings.chips*(1+(r.players[u].rebuys||0));
  const total=ids.reduce((a,u)=>a+r.players[u].chips,0)+pot;
  const totalIn=ids.reduce((a,u)=>a+buyin(u),0),totalRb=ids.reduce((a,u)=>a+(r.players[u].rebuys||0),0);
  const rows=ids.slice().sort((a,b)=>stack(b)-stack(a)).map((u,i)=>{const p=r.players[u],net=stack(u)-buyin(u);
    return `<tr${u===S.me?' class="meRow"':''}><td>${i+1}</td><td class="nmc">${esc(p.name)}${p.left?' (나감)':''}</td><td>${fmt(p.chips)}</td><td>${p.rebuys?`<span class="rb2">${p.rebuys}회</span>`:'-'}</td><td class="${net>0?'pos':net<0?'neg':''}">${net>0?'+':''}${fmt(net)}</td></tr>`}).join('');
  return `<div class="stats"><div class="row" style="margin:0 0 8px"><h3 style="margin:0;flex:1">📊 칩 현황</h3><button class="small" data-act="stats">닫기</button></div>
    <div class="sgrid"><div><span>테이블 총 칩</span><b>${fmt(total)}</b></div><div><span>총 바이인</span><b>${fmt(totalIn)}</b></div><div><span>총 리바인</span><b>${totalRb}회</b></div></div>
    ${pot?`<p class="muted" style="margin:6px 0 0">진행 중인 팟 ${fmt(pot)} 포함</p>`:''}
    <table><thead><tr><th>#</th><th>이름</th><th>보유 칩</th><th>리바인</th><th>손익</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="muted" style="margin:6px 0 0">손익 = 지금 칩 − (시작 칩 × (1 + 리바인 횟수)) · 자리의 R2 = 리바인 2회</p></div>`;
}
function sheet(inner,act){return `<div class="sheetbg" data-act="${act}"></div><div class="sheet">${inner}</div>`}
function menuPanel(r,H){
  const p=r.players[S.me]||{},host=S.practice||r.host===S.me;
  return `<div class="row" style="margin:0 0 8px"><h3 style="margin:0;flex:1">☰ 메뉴</h3><button class="small" data-act="menu">닫기</button></div>
   <div class="mgrid">
    <button data-act="${p.sitOut?'back':'sit'}">${p.sitOut?'▶️ 다시 참여':'☕ 다음 판부터 쉬기'}</button>
    ${S.practice?'':'<button data-act="copyinvite">💬 초대 메시지 복사</button>'}
    <button data-act="voicepanel">🎙 목소리 바꾸기</button><button data-act="vtest">🔈 소리 테스트</button>
    <button data-act="leave">🚪 나가기</button></div>
   ${host?`<h3 style="margin:14px 0 6px">👑 방장 메뉴</h3>${hostBar(r,H)}`:''}
   ${H&&H.log.length?`<h3 style="margin:14px 0 6px">📜 진행 기록</h3><div class="log">${H.log.slice(-30).reverse().map(esc).join('<br>')}</div>`:''}`;
}
function myPanel(r,H){
  const me=S.me,p=r.players[me];if(!p)return '';
  const ps=H&&H.ps[me];
  let h=`<div class="mine">`;
  if(ps){
    const cards=S.my.n===H.n&&S.my.cards?S.my.cards:null;
    let str='';
    if(cards){const all=cards.concat(H.board);
      if(all.length>=5)str=handName(best(all));else str=cards[0][0]===cards[1][0]?'포켓 페어!':(cards[0][1]===cards[1][1]?'같은 무늬 두 장':'하이카드')}
    h+=`<div class="mycards">${cards?cards.map(c=>cardHTML(c,'big'+(S.myseen!==H.n?' fresh':''))).join(''):cardHTML('back','big')+cardHTML('back','big')}
      <div class="mystr"><span class="muted">내 패</span><b>${cards?esc(str):S.my.fail?'카드를 열 수 없어요':'카드 여는 중…'}</b>
      <span class="muted">🪙 ${fmt(p.chips)} ${ps.folded?'· 폴드함':ps.allin?'· 올인!':''}</span></div></div>`;
    if(H.street!=='done'&&H.toAct===me&&!ps.folded)h+=actionBox(r,H,ps,p);
    else if(H.street!=='done'&&!ps.folded&&!ps.allin)h+=`<div class="wait">${esc(nm(H.toAct))} 님 차례예요</div>`;
    if(H.street==='done'&&H.result&&!H.result.show&&H.result.won[me]&&!H.shown[me])h+=`<button class="primary" data-act="show">🃏 카드 까서 자랑하기</button>`;
  }else{
    h+=`<div class="wait">${p.chips===0?(r.settings.rebuy===0?'칩이 다 떨어져서 탈락했어요 💀 관전 중':'칩이 다 떨어졌어요 💀 리바인할지 골라 주세요'):p.sitOut?'쉬는 중이에요':'다음 판부터 참여해요'}</div>`;
  }
  const inHand=ps&&H.street!=='done'&&!ps.folded;
  if(p.chips===0&&!inHand){if(r.settings.rebuy!==0)h+=`<button class="primary" data-act="rebuy">🔄 리바인 하기 (+${fmt(r.settings.chips)})</button><p class="muted" style="text-align:center;margin:6px 0 0">안 누르면 관전만 해요${p.rebuys?` · 지금까지 리바인 ${p.rebuys}회`:''}</p>`}
  return h+`</div>`;
}
function actionBox(r,H,ps,p){
  if(S.pendingAt)return `<div class="wait">전송 중…</div>`;
  const timer=`<div class="tbar"><div class="tfill" data-dlbar></div></div>`;
  const toCall=Math.min(H.curBet-ps.bet,p.chips),max=ps.bet+p.chips;
  const pot=H.seats.reduce((a,u)=>a+H.ps[u].total,0);
  const minTo=Math.min(H.curBet+H.minRaise,max);
  const canRaise=max>H.curBet;
  if(!S.raise||S.raise<minTo||S.raise>max||S.raiseHand!==H.n+':'+H.street+':'+H.curBet){S.raise=minTo;S.raiseHand=H.n+':'+H.street+':'+H.curBet}
  const showR=canRaise&&p.chips>toCall;
  let h=timer+`<div class="acts ${showR?'a3':''}">`;
  h+=toCall>0?`<button class="bfold" data-act="fold">폴드</button>`:`<button class="bfold" data-act="check">체크</button>`;
  h+=toCall>0?`<button class="bcall" data-act="call">${toCall>=p.chips?'올인 콜':'콜'} ${fmt(toCall)}</button>`:`<button class="bcall" data-act="check">체크 ✓</button>`;
  if(showR)h+=`<button class="braise" data-act="raiseopen">${H.curBet===0?'벳':'레이즈'} ${S.raiseOpen?'▴':'▾'}</button>`;
  h+=`</div>`;
  if(showR&&S.raiseOpen){
    const q=(x)=>Math.max(minTo,Math.min(max,Math.round(x)));
    const half=q(H.curBet+(pot+toCall)/2),full=q(H.curBet+pot+toCall);
    h+=`<div class="raisebox"><div class="row" style="margin:0"><b style="flex:1">${H.curBet===0?'벳':'레이즈'} <span id="rv" style="color:#ff8a3d;font-size:20px">${fmt(S.raise)}</span></b></div>
      <input type="range" id="rr" min="${minTo}" max="${max}" step="${H.bbA>=10?Math.max(1,H.bbA/2):1}" value="${S.raise}">
      <div class="quick"><button data-rq="${minTo}">최소</button><button data-rq="${half}">½팟</button><button data-rq="${full}">팟</button><button data-rq="${max}">올인</button></div>
      <div class="acts" style="grid-template-columns:2fr 1fr"><button class="braise" data-act="raise">${H.curBet===0?'벳':'레이즈'}!</button><button class="ballin" data-act="allin">올인 🔥</button></div></div>`;
  }
  return h;
}
function hostBar(r,H){
  const b=[];
  if(S.practice&&r.settings.rebuy!==0&&(!H||H.street==='done')){const bust=r.order.filter(u=>r.players[u].bot&&r.players[u].chips===0);if(bust.length)b.push(`<button data-act="botrebuy">🤖 게스트 리바인 (${bust.length}명)</button>`)}
  const waiting=H&&H.street!=='done'&&H.toAct;
  if(waiting&&H.toAct!==S.me&&!S.practice)b.push(`<button data-act="kick">⏰ ${esc(nm(H.toAct))} 폴드 처리</button>`);
  if(H&&H.street==='done')b.push(`<button data-act="deal">▶️ 다음 판 바로</button>`);
  b.push(`<button data-act="pause">${r.paused?'▶️ 자동 진행 켜기':'⏸ 자동 진행 멈추기'}</button>`);
  if(H&&H.street!=='done'&&(S.practice&&(!HP||HP.n!==H.n)))b.push(`<button data-act="void">⚠️ 이번 판 무효</button>`);
  return `<div class="hostbar">${b.join('')}</div>${H&&H.street!=='done'&&(S.practice&&(!HP||HP.n!==H.n))?'<p class="muted" style="color:#fff">방장 기기에서 이번 판 카드 정보를 찾지 못했어요. 무효 처리 후 다음 판을 시작해 주세요.</p>':''}`;
}

/* ---- events ---- */
document.addEventListener('click',e=>{
  const st=e.target.closest('[data-set]');
  if(st){const k=st.dataset.set,v=st.dataset.v;S.create[k]=+v;const n=$('#nameIn');if(n)S.name=n.value;const c=$('#codeIn');if(c)S.joinCode=c.value;render();return}
  const vn=e.target.closest('[data-vname]');if(vn){S.vname=vn.dataset.vname;ls('h_vname',S.vname);audioUnlock();S.ttsBroken=false;speak('딜러입니다. 레이즈 2000!',true);render();return}
  const vy=e.target.closest('[data-vstyle]');if(vy){S.vstyle=vy.dataset.vstyle;ls('h_vstyle',S.vstyle);audioUnlock();S.ttsBroken=false;speak('딜러입니다. 레이즈 2000!',true);render();return}
  const em=e.target.closest('[data-emo]');if(em){emote(+em.dataset.emo);return}
  const rq=e.target.closest('[data-rq]');if(rq){S.raise=+rq.dataset.rq;const rr=$('#rr');if(rr)rr.value=S.raise;const rv=$('#rv');if(rv)rv.textContent=fmt(S.raise);return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;S.err='';
  if(a==='homeSettings'){const nick=$('#nameIn');if(nick)S.name=nick.value.trim().slice(0,10);S.showHomeSettings=!S.showHomeSettings;S.showCreateOptions=false;render()}
  else if(a==='createOptions'){const nick=$('#nameIn');if(nick)S.name=nick.value.trim().slice(0,10);S.showCreateOptions=true;S.showHomeSettings=true;render();const panel=$('#createOptions');if(panel)panel.scrollIntoView({behavior:'smooth',block:'nearest'})}
  else if(a==='joinopen'){const nick=$('#nameIn');if(nick)S.name=nick.value.trim().slice(0,10);S.showJoin=!S.showJoin;render()}
  else if(a==='copyapp')copyText(location.origin+'/', '앱 주소가 복사됐어요. 친구에게 보내세요.');
  else if(a==='full'){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}catch(e){toast('전체화면을 지원하지 않는 브라우저입니다')}}
  else if(a==='create')createRoom();
  else if(a==='practice')startPractice();
  else if(a==='voice'){S.voice=!S.voice;ls('h_voice',S.voice?'1':'0');
    if(S.voice){S.vp=null;S.vUnlocked=true;audioUnlock();sfx('turn');
      if(!window.speechSynthesis){S.ttsBroken=true;ttsFailNotice()}
      else{S.ttsChecked=false;speak('음성 안내를 켰어요',true);toast('🔊 음성 안내 켜짐 — 안 들리면 무음 모드와 볼륨을 확인해 주세요',3500)}}
    else{try{speechSynthesis.cancel()}catch(e){}toast('🔇 음성 안내 꺼짐')}render()}
  else if(a==='voicepanel'){S.showVoice=!S.showVoice;S.showMenu=false;S.showStats=false;render()}
  else if(a==='vtest'){audioUnlock();sfx('win');S.ttsChecked=false;S.ttsBroken=false;S.ttsNoticed=false;speak('소리 테스트입니다. 잘 들리나요?',true);const d=voiceDiag();toast(`음성기능 ${d.has?'있음':'없음'} · 목소리 ${d.n}개(한국어 ${d.ko}) · 효과음 ${d.audio?'가능':'불가'}`,5000)}
  else if(a==='copy')copyCode();
  else if(a==='copyinvite')copyText(inviteText(),'💬 초대 메시지 복사됨! 카톡에 붙여넣기 하세요');
  else if(a==='stats'){S.showStats=!S.showStats;S.showMenu=false;S.showVoice=false;render()}
  else if(a==='menu'){S.showMenu=!S.showMenu;S.showStats=false;S.showVoice=false;render()}
  else if(a==='raiseopen'){S.raiseOpen=!S.raiseOpen;render()}
  else if(a==='botrebuy'){if(S.practice)hq(()=>{HR.order.forEach(u=>{const p=HR.players[u];if(p.bot&&p.chips===0){p.chips=HR.settings.chips;p.rebuys=(p.rebuys||0)+1;if(HR.hand)hlog(HR.hand,`🔄 ${p.name} 리바인 · ${p.rebuys}번째`)}});commit()})}
  else if(a==='join')joinRoom(($('#codeIn')||{}).value);
  else if(a==='leave'){S.showMenu=false;leaveRoom()}
  else if(a==='deal'){if(S.practice)hq(hostDeal);else send({t:'host',op:'deal'})}
  else if(a==='pause'){if(S.practice)hq(()=>{HR.paused=!HR.paused;commit()});else send({t:'host',op:'pause'})}
  else if(a==='kick'){if(S.practice)hq(()=>{const H=HR.hand;if(H&&H.toAct){forceFold(HR,HP,H.toAct,'시간 초과');commit()}});else send({t:'host',op:'kick'})}
  else if(a==='void'){if(S.practice)hq(()=>{voidHand(HR);commit()});else send({t:'host',op:'void'})}
  else if(['fold','check','call','allin','sit','back','rebuy','show'].includes(a))act(a);
  else if(a==='raise'){S.raiseOpen=false;act('raise',{to:S.raise})}
});
document.addEventListener('input',e=>{if(e.target.id==='rr'){S.raise=+e.target.value;const rv=$('#rv');if(rv)rv.textContent=fmt(S.raise)}});
document.addEventListener('pointerdown',e=>{if(e.target.id==='rr')S.dragging=true});
document.addEventListener('pointerup',()=>{if(S.dragging){S.dragging=false;setTimeout(render,50)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='codeIn')joinRoom(e.target.value)});
setInterval(()=>{const H=R()&&R().hand;if(H&&H.street==='done'&&!S.dragging&&S.view==='room')render()},3000);
</script>
</body>
