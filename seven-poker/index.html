function showRanks(){
 const items=[
 ['로티플','같은 무늬의 10, J, Q, K, A',['10♠','J♠','Q♠','K♠','A♠']],
 ['스티플','동일한 무늬의 연속된 숫자 5장',['5♥','6♥','7♥','8♥','9♥']],
 ['포카드','같은 숫자 4장',['9♠','9♥','9♦','9♣','3♦']],

 ['플러시','동일한 무늬 5장',['2♦','5♦','7♦','9♦','Q♦']],
 ['스트레이트','연속된 숫자 5장',['4♣','5♦','6♠','7♥','8♣']],
 ['트리플','같은 숫자 3장',['7♠','7♥','7♣','K♦','2♠']],
 ['투페어','같은 숫자 2장씩 두 쌍',['J♠','J♦','5♣','5♥','A♠']],
 ['원페어','같은 숫자 2장',['K♥','K♣','3♠','8♦','10♣']],

 ];
 const card=s=>'<span class="rank-card '+(/[♥♦]/.test(s)?'red':'')+'">'+s+'</span>';
 const overlay=document.createElement('div');overlay.className='rank-overlay';overlay.id='rankOverlay';overlay.innerHTML='<div class="rank-dialog" role="dialog" aria-modal="true" aria-label="세븐포커 족보 순위"><div class="rank-head"><div class="minor">♠ ♥ SEVEN POKER ♦ ♣</div><h2>7포커 족보 순위</h2><div class="minor">7장 중 가장 높은 5장 조합으로 승부합니다</div></div>'+items.map((x,i)=>'<div class="rank-line"><span class="rank-num">'+(i+1)+'</span><span class="rank-title">'+x[0]+'</span><span class="rank-desc">'+x[1]+'</span><div class="rank-cards">'+x[2].map(card).join('')+'</div></div>').join('')+'<p class="rank-note">※ 로티플은 로열 스트레이트 플러시, 스티플은 스트레이트 플러시입니다. 스트레이트 A-2-3-4-5는 가장 낮은 스트레이트로 계산합니다.</p><button class="btn rank-close" id="closeRanks">게임으로 돌아가기</button></div>';
 document.body.appendChild(overlay);overlay.querySelector('#closeRanks').onclick=()=>overlay.remove();overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};
}

function top(){return '<div class="top"><div class="brand">♠ 친구끼리 세븐포커</div><div class="settings"><button class="chip" id="ranks">🏆 족보</button><button class="chip" id="voice">'+(voicesOn?'🔊':'🔇')+'</button><select id="voiceSel" aria-label="음성 선택"><option value="">기본 음성</option></select><button class="chip" id="full">⛶</button></div></div>'}
function controls(){let rankButton=$('#ranks');if(rankButton)rankButton.onclick=showRanks;let v=$('#voice'),f=$('#full'),sel=$('#voiceSel');if(v)v.onclick=()=>{voicesOn=!voicesOn;v.textContent=voicesOn?'🔊':'🔇';if(voicesOn)say('음성 안내가 켜졌습니다')};if(f)f.onclick=()=>{let d=document.documentElement;if(!document.fullscreenElement)d.requestFullscreen?.().catch(()=>toast('브라우저 메뉴에서 전체화면을 선택하세요'));else document.exitFullscreen?.()};if(sel){let voices=speechSynthesis?.getVoices()||[];voices.filter(x=>x.lang.startsWith('ko')).forEach(x=>{let o=document.createElement('option');o.value=x.name;o.textContent=x.name;sel.appendChild(o)});sel.value=voiceChoice;sel.onchange=()=>{voiceChoice=sel.value;say('음성 변경 완료')}}}
function home(){clearInterval(timer);timer=null;el.innerHTML=top()+'<div class="landing"><div class="logo">🂡</div><h1>친구끼리 세븐포커</h1><p>2~5명 · 7장 포커 · 무료 칩 게임</p><div class="menu"><button class="btn" id="practice">🤖 연습 시작</button><button class="btn secondary" id="guest">🃏 게스트 게임</button><button class="btn" id="make">🏠 방 만들기</button><button class="btn secondary" id="join">🔑 친구 방 입장</button></div><p class="minor">베팅은 가상 칩으로만 진행됩니다. 실제 돈 거래는 지원하지 않습니다.</p></div>';controls();$('#practice').onclick=()=>localStart(2);$('#guest').onclick=()=>localStart(4);$('#make').onclick=()=>enter('create');$('#join').onclick=()=>enter('join');}
function enter(which){el.innerHTML=top()+'<div class="panel"><h2>'+(which==='create'?'🏠 친구 방 만들기':'🔑 친구 방 입장')+'</h2><label>닉네임</label><input id="nick" class="field" maxlength="12" placeholder="닉네임" value="'+escapeHtml(nick)+'">'+(which==='join'?'<label>방 코드</label><input id="code" class="field" maxlength="8" placeholder="예: 4XD92P" value="'+escapeHtml(new URLSearchParams(location.search).get('room')||'')+'">':'')+'<div class="wrap"><button id="go" class="btn">'+(which==='create'?'방 생성':'방 입장')+'</button><button id="back" class="btn outline">뒤로</button></div><p class="minor">친구와 같은 인터넷에 있을 필요는 없지만, 연결 중계 서비스 상태에 따라 접속이 실패할 수 있습니다.</p></div>';controls();$('#back').onclick=home;$('#go').onclick=()=>{nick=$('#nick').value.trim()||'플레이어';localStorage.setItem('seven_nick',nick);which==='create'?createRoom():joinRoom($('#code').value.trim().toUpperCase())};}
function localStart(count){role='local';myId='human';mode='practice';let players=[newPlayer(myId,nick,false)];for(let i=1;i<=count;i++)players.push(newPlayer('bot'+i,['민수','지연','하늘','도윤'][i-1],true));game={players,hand:0,pot:0,stage:0,round:0,turn:null,raises:0,deck:[],status:'',dealer:0,waiting:false};newHand();render();}
function newPlayer(id,name,bot){return{id,name,bot,stack:10000,cards:[],fold:false,bet:0,total:0,acted:false,choice:-1,rebuys:0}}
function newDeck(){let d=[];for(let s=0;s<4;s++)for(let r=0;r<13;r++)d.push({r,s});for(let i=d.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}return d}
function active(){return game.players.filter(p=>!p.fold&&p.cards.length)}
function live(){return active().filter(p=>p.stack>0)}
function newHand(){if(!game)return;clearInterval(timer);let g=game;g.hand++;g.stage=0;g.raises=0;g.round=0;g.waiting=false;g.deck=newDeck();g.pot=0;g.dealer=(g.dealer+1)%g.players.length;g.players.forEach(p=>{p.bet=0;p.total=0;p.acted=false;p.choice=-1;p.fold=p.stack<=0;p.cards=p.fold?[]:[g.deck.pop(),g.deck.pop(),g.deck.pop()]});g.status='오픈할 카드 1장을 선택하세요';g.turn=null;if(role!=='client'){g.players.filter(p=>p.bot&&!p.fold).forEach(p=>p.choice=2);schedule();}broadcast();render();say('새 게임입니다. 오픈할 카드를 선택하세요')}
function choose(id,n){let p=game.players.find(x=>x.id===id);if(!p||p.fold||game.stage!==0||p.choice!==-1||n<0||n>2)return;p.choice=n;if(game.players.filter(x=>!x.fold).every(x=>x.choice>=0)){game.stage=4;game.players.forEach(x=>{if(!x.fold)x.cards.push(game.deck.pop())});startBet()}else{game.status='다른 참가자의 카드 선택 대기 중';broadcast();render()}}
function startBet(){game.raises=0;game.round=1;game.players.forEach(p=>{p.bet=0;p.acted=false});let a=active();let order=a.slice().sort((x,y)=>upScore(y)-upScore(x));game.turn=(order.find(p=>p.stack>0)||{}).id||null;game.status=game.stage+'구 베팅';broadcast();render();say(game.stage+'구 베팅 시작');schedule()}
function upScore(p){let visible=p.cards.filter((_,i)=>i===p.choice||i>=3&&i<=5);return visible.reduce((a,c)=>a+Math.pow(14,c.r+1),0)}
function toCall(p){return Math.max(0,Math.max(...active().map(x=>x.bet),0)-p.bet)}
function nextTurn(from){let a=game.players.filter(p=>!p.fold&&p.stack>0);if(a.length<2){finishRound();return}let currentMax=Math.max(...active().map(p=>p.bet),0);if(a.every(p=>p.acted&&p.bet===currentMax)){finishRound();return}let start=game.players.findIndex(p=>p.id===from);for(let i=1;i<=game.players.length;i++){let p=game.players[(start+i)%game.players.length];if(p&&!p.fold&&p.stack>0&&(!p.acted||p.bet<currentMax)){game.turn=p.id;game.status=p.name+' 님 차례';broadcast();render();schedule();return}}finishRound()}
function finishRound(){clearInterval(timer);let a=active();if(a.length===1){payout();return}if(game.stage<7){game.stage++;game.players.forEach(p=>{if(!p.fold)p.cards.push(game.deck.pop())});startBet();return}payout()}
function bet(id,act){if(!game||game.waiting||game.turn!==id)return;let p=game.players.find(x=>x.id===id);if(!p||p.fold||p.stack<=0)return;let call=toCall(p),maxBet=Math.max(...active().map(x=>x.bet)),min=100;let add=0,raise=false;
if(act==='die'){p.fold=true;p.acted=true}
else if(act==='check'){if(call>0)return;p.acted=true}
else if(act==='call'){add=Math.min(call,p.stack);p.acted=true}
else{if(game.raises>=(game.stage===4?1:2))return;let pot=game.pot+game.players.reduce((s,x)=>s+x.bet,0);let amount=act==='ping'?min:act==='double'?Math.max(min,call*2):act==='quarter'?Math.max(min,Math.ceil(pot/4/100)*100):act==='half'?Math.max(min,Math.ceil(pot/2/100)*100):Math.max(min,Math.ceil(pot/100)*100);add=Math.min(p.stack,call+amount);if(add<=call)return;raise=true;p.acted=true}
p.stack-=add;p.bet+=add;p.total+=add;if(raise){game.raises++;game.players.forEach(x=>{if(x.id!==p.id&&!x.fold&&x.stack>0)x.acted=false})}
game.status=p.name+' : '+({die:'다이',check:'체크',call:'콜',ping:'삥',double:'따당',quarter:'쿼터',half:'하프',full:'풀'}[act]||act);say(game.status);nextTurn(id);}
function evaluate(cards){let best=null;for(let a=0;a<cards.length-4;a++)for(let b=a+1;b<cards.length-3;b++)for(let c=b+1;c<cards.length-2;c++)for(let d=c+1;d<cards.length-1;d++)for(let e=d+1;e<cards.length;e++){let v=eval5([cards[a],cards[b],cards[c],cards[d],cards[e]]);if(!best||compare(v,best)>0)best=v}return best||[0]}
function eval5(cs){let rr=cs.map(c=>c.r+2).sort((a,b)=>b-a),cnt={};rr.forEach(r=>cnt[r]=(cnt[r]||0)+1);let groups=Object.entries(cnt).map(([r,n])=>[+r,n]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);let flush=cs.every(c=>c.s===cs[0].s);let u=[...new Set(rr)];if(u.includes(14))u.push(1);let straight=0;for(let i=0;i+4<u.length;i++)if(u[i]-u[i+4]===4){straight=u[i];break}
if(flush&&straight)return[8,straight];if(groups[0][1]===4)return[7,groups[0][0],groups[1][0]];if(groups[0][1]===3&&groups[1][1]===2)return[6,groups[0][0],groups[1][0]];if(flush)return[5,...rr];if(straight)return[4,straight];if(groups[0][1]===3)return[3,groups[0][0],...groups.slice(1).map(x=>x[0]).sort((a,b)=>b-a)];if(groups[0][1]===2&&groups[1][1]===2)return[2,Math.max(groups[0][0],groups[1][0]),Math.min(groups[0][0],groups[1][0]),groups[2][0]];if(groups[0][1]===2)return[1,groups[0][0],...groups.slice(1).map(x=>x[0]).sort((a,b)=>b-a)];return[0,...rr]}
function compare(a,b){for(let i=0;i<Math.max(a.length,b.length);i++)if((a[i]||0)!==(b[i]||0))return(a[i]||0)-(b[i]||0);return 0}
function payout(){clearInterval(timer);let g=game;g.waiting=true;g.turn=null;g.pot=g.players.reduce((s,p)=>s+p.total,0);let remaining=active();let winnerNames=[];
let levels=[...new Set(g.players.map(p=>p.total).filter(x=>x>0))].sort((a,b)=>a-b),prev=0;for(let lv of levels){let contributors=g.players.filter(p=>p.total>=lv),amount=(lv-prev)*contributors.length,eligible=remaining.filter(p=>p.total>=lv);prev=lv;if(!eligible.length){contributors.forEach(p=>p.stack+=amount/contributors.length);continue}let rated=eligible.map(p=>({p,v:evaluate(p.cards)})).sort((a,b)=>compare(b.v,a.v));let win=rated.filter(x=>compare(x.v,rated[0].v)===0);let share=Math.floor(amount/win.length),left=amount-share*win.length;win.forEach((x,i)=>{x.p.stack+=share+(i<left?1:0);winnerNames.push(x.p.name)})}
let names=[...new Set(winnerNames)];g.status=(names.join(', ')||'승자 없음')+' 승리!';showResult=true;broadcast();render();say('쇼다운. '+g.status);setTimeout(()=>{if(!game||game!==g)return;showResult=false;let remaining=g.players.filter(p=>p.stack>0);if(remaining.length<=1){g.status='최종 우승: '+(remaining[0]?.name||'없음');g.waiting=true;broadcast();render();say(g.status);return}newHand()},6500)}
function cardHtml(c,hidden,extra=''){if(hidden||!c)return '<span class="card back '+extra+'">✦</span>';return '<span class="card '+(c.s===1||c.s===2?'red ':'')+extra+'">'+(c.r>=8?ranks[c.r]:c.r+2)+suits[c.s]+'</span>'}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function publicState(forId){if(!game)return null;return {...game,deck:[],players:game.players.map(p=>({...p,cards:p.cards.map((c,i)=>showResult||p.id===forId?c:(i===p.choice||i>=3&&i<=5)?c:null)}))}}
function broadcast(){if(role==='host')Object.entries(connections).forEach(([id,c])=>{if(c.open)try{c.send({type:'state',state:publicState(id)})}catch(e){}});view=publicState(myId)}
function drawPlayers(g){let mine=g.players.find(p=>p.id===myId),others=g.players.filter(p=>p.id!==myId),positions=others.length===1?[[50,8]]:others.length===2?[[23,12],[77,12]]:others.length===3?[[16,26],[50,8],[84,26]]:[[16,24],[38,7],[62,7],[84,24]];return others.map((p,i)=>{let [x,y]=positions[i]||[50,8];return '<div class="seat '+(g.turn===p.id?'turn ':'')+(p.fold?'fold':'')+'" style="left:'+x+'%;top:'+y+'%"><div class="name">'+escapeHtml(p.name)+(p.bot?' 🤖':'')+'</div><div class="small">🪙 '+money(p.stack)+(p.fold?' · 다이':'')+'</div><div class="cards">'+p.cards.map((c,j)=>cardHtml(c,!c)).join('')+'</div><div class="small">베팅 '+money(p.bet)+'</div></div>'}).join('')+(mine?'<div class="seat me '+(g.turn===mine.id?'turn ':'')+(mine.fold?'fold':'')+'" style="left:50%;top:96%"><div class="name">나 · '+escapeHtml(mine.name)+'</div><div class="small">🪙 '+money(mine.stack)+' | 베팅 '+money(mine.bet)+'</div></div>':'')}
function render(){let g=role==='client'?view:publicState(myId);if(!g){home();return}let mine=g.players.find(p=>p.id===myId);let choice=g.stage===0&&mine&&!mine.fold&&mine.choice===-1;let yourTurn=mine&&g.turn===myId&&!g.waiting;let call=mine?Math.max(0,Math.max(...g.players.filter(p=>!p.fold).map(p=>p.bet),0)-mine.bet):0;let raisesAvailable=g.raises<(g.stage===4?1:2);let canRaise=yourTurn&&raisesAvailable&&mine.stack>call;let pot=g.players.reduce((s,p)=>s+p.total,0);
el.innerHTML=top()+'<div class="row" style="margin-top:8px"><span class="chip">'+(role==='local'?'🤖 연습':role==='host'?'🏠 방 '+room:'🔗 방 '+room)+'</span><span class="chip">핸드 '+g.hand+' · '+(g.stage?g.stage+'구 / '+g.round+'차 레이스':'카드 선택')+'</span><button id="leave" class="chip">나가기</button></div><div class="table"><div class="seats">'+drawPlayers(g)+'</div><div class="center"><div class="minor">총 팟</div><div class="pot">🪙 '+money(pot)+'</div><div class="stage">'+(g.stage?g.stage+'구':'오픈카드 선택')+'</div></div></div><div class="status">'+escapeHtml(g.status)+(yourTurn?' · 내 차례 ⏳':'')+'</div><div class="timer"><span id="bar" style="width:100%"></span></div><div class="myhand"><div class="small">내 카드 '+(choice?'— 공개할 카드 1장을 누르세요':'— 히든 카드는 본인만 보입니다')+'</div><div class="cards">'+(mine?mine.cards.map((c,i)=>'<span data-pick="'+i+'" style="display:inline-flex;cursor:'+(choice?'pointer':'default')+'">'+cardHtml(c,!c,choice?'pick':'')+'</span>').join(''):'관전 중')+'</div></div><div class="actions">'+(choice?'<button class="btn" id="autoChoice" style="grid-column:span 4">세 번째 카드를 오픈</button>':[['die','다이'],['check','체크'],['call','콜 '+money(call)],['ping','삥'],['double','따당'],['quarter','쿼터'],['half','하프'],['full','풀']].map(([a,label])=>'<button class="btn '+(a==='die'?'danger':a==='call'?'secondary':'')+'" data-act="'+a+'" '+(!(yourTurn&&(a==='die'||a==='check'&&call===0||a==='call'&&call>0||['ping','double','quarter','half','full'].includes(a)&&canRaise))?'disabled':'')+'>'+label+'</button>').join(''))+'</div>'+(role==='host'&&g.stage===-1?'<div class="wrap"><button class="btn" id="startGame">게임 시작</button></div>':'')+(g.waiting&&g.players.filter(p=>p.stack>0).length<=1?'<button id="restart" class="btn">새 토너먼트</button>':'');
controls();$('#leave').onclick=()=>{if(confirm('게임을 나갈까요?')){peer?.destroy();peer=null;connections={};hostConn=null;history.replaceState(null,'',location.pathname);home()}};if(choice){document.querySelectorAll('[data-pick]').forEach(e=>e.onclick=()=>sendAct({type:'choose',n:+e.dataset.pick}));$('#autoChoice').onclick=()=>sendAct({type:'choose',n:2})}else document.querySelectorAll('[data-act]').forEach(e=>e.onclick=()=>sendAct({type:'bet',act:e.dataset.act}));let re=$('#restart');if(re)re.onclick=()=>{g.players.forEach(p=>p.stack=10000);if(role==='client')return;newHand()};if(role!=='client'&&g.turn&&g.players.find(p=>p.id===g.turn)?.bot)schedule();updateBar()}
function sendAct(msg){if(role==='client'){if(hostConn?.open)hostConn.send(msg);else toast('호스트 연결이 끊겼습니다');return}if(msg.type==='choose')choose(myId,msg.n);if(msg.type==='bet')bet(myId,msg.act)}
function schedule(){clearInterval(timer);if(!game||game.waiting)return;let g=game;if(g.stage===0){g.players.filter(p=>p.bot&&p.choice<0&&!p.fold).forEach(p=>p.choice=2);if(g.players.filter(p=>!p.fold).every(p=>p.choice>=0)){g.stage=4;g.players.forEach(p=>{if(!p.fold)p.cards.push(g.deck.pop())});startBet()}return}let p=g.players.find(p=>p.id===g.turn);if(!p)return;deadline=Date.now()+8000;if(p.bot){timer=setInterval(()=>{updateBar();if(Date.now()>=deadline-6500){clearInterval(timer);let call=toCall(p);bet(p.id,call>p.stack?'call':call>0?'call':Math.random()<.2?'ping':'check')}},130)}else{timer=setInterval(()=>{updateBar();if(Date.now()>deadline){clearInterval(timer);bet(p.id,'die')}},170)}}
function updateBar(){let b=$('#bar');if(b&&deadline&&game?.turn)b.style.width=Math.max(0,Math.min(100,(deadline-Date.now())/80))+'%'}
function waiting(){el.innerHTML=top()+'<div class="panel"><h2>🏠 방 코드 <strong style="color:#ffe093">'+room+'</strong></h2><p>친구에게 링크를 보내고 함께 입장하세요.</p><input id="invite" class="field" readonly value="'+escapeHtml(location.origin+location.pathname+'?room='+room)+'"><button class="btn" id="share">초대 링크 공유 / 복사</button><h3>참여자 <span id="count"></span></h3><div id="names"></div><div class="wrap"><button id="start" class="btn">게임 시작 (2명 이상)</button><button id="addbot" class="btn secondary">🤖 봇 추가</button><button id="back" class="btn outline">나가기</button></div><p class="minor">호스트가 게임을 진행합니다. 호스트가 나가면 방은 종료됩니다.</p></div>';controls();$('#share').onclick=async()=>{let u=$('#invite').value;try{if(navigator.share)await navigator.share({title:'세븐포커',url:u});else{await navigator.clipboard.writeText(u);toast('초대 링크 복사 완료')}}catch(e){toast('주소창의 링크를 복사하세요')}};$('#back').onclick=()=>{peer?.destroy();home()};$('#start').onclick=()=>{if(game.players.length<2){toast('2명 이상 필요합니다');return}newHand()};$('#addbot').onclick=()=>{if(game.players.length>=5)return;game.players.push(newPlayer('bot'+uid(),'연습봇',true));updateWaiting()};updateWaiting()}
function updateWaiting(){if(!$('#names')||!game)return;$('#names').innerHTML=game.players.map(p=>'<div class="chip" style="margin:5px;display:inline-block">'+escapeHtml(p.name)+'</div>').join('');$('#count').textContent=game.players.length+'/5';$('#start').disabled=game.players.length<2;$('#addbot').disabled=game.players.length>=5}
function createRoom(){if(typeof Peer==='undefined'){toast('온라인 연결 라이브러리를 불러오지 못했습니다');return}room=uid().slice(0,6);myId='host';role='host';game={players:[newPlayer(myId,nick,false)],hand:0,pot:0,stage:-1,round:0,turn:null,raises:0,deck:[],status:'',dealer:0,waiting:true};peer=new Peer('sevpoker-'+room,{debug:0});peer.on('open',()=>{history.replaceState(null,'',location.pathname+'?room='+room);waiting();toast('방이 생성되었습니다')});peer.on('connection',c=>{c.on('open',()=>{if(game.hand>0||game.players.length>=5){c.send({type:'error',message:'진행 중이거나 인원이 가득 찬 방입니다'});c.close();return}connections[c.peer]=c;c.on('data',msg=>{let p=game?.players.find(x=>x.id===c.peer);if(msg.type==='join'&&!p){game.players.push(newPlayer(c.peer,String(msg.nick||'친구').slice(0,12),false));updateWaiting();c.send({type:'welcome',id:c.peer,room});broadcast()}else if(p){if(msg.type==='choose')choose(c.peer,Number(msg.n));if(msg.type==='bet')bet(c.peer,msg.act)}});c.on('close',()=>{delete connections[c.peer];let p=game?.players.find(x=>x.id===c.peer);if(p){if(game.hand===0)game.players=game.players.filter(x=>x.id!==c.peer);else p.fold=true;updateWaiting();broadcast();render()}})})});peer.on('error',e=>toast('방 연결 오류: '+e.type));}
function joinRoom(code){if(!code){toast('방 코드를 입력하세요');return}if(typeof Peer==='undefined'){toast('연결 라이브러리를 불러오지 못했습니다');return}room=code;role='client';myId='';el.innerHTML=top()+'<div class="panel" style="text-align:center"><h2>🔗 친구 방 접속 중...</h2><p>방 코드: '+escapeHtml(room)+'</p><button class="btn outline" onclick="location.reload()">취소</button></div>';controls();peer=new Peer({debug:0});peer.on('open',id=>{myId=id;hostConn=peer.connect('sevpoker-'+room,{reliable:true});hostConn.on('open',()=>{hostConn.send({type:'join',nick});toast('친구 방 연결됨')});hostConn.on('data',msg=>{if(msg.type==='error'){toast(msg.message);return}if(msg.type==='welcome'){toast('입장 완료')}if(msg.type==='state'){view=msg.state;if(view.hand===0){el.innerHTML=top()+'<div class="panel" style="text-align:center"><h2>친구를 기다리고 있습니다</h2><p>방 코드 '+escapeHtml(room)+'</p><div>'+view.players.map(p=>'<span class="chip">'+escapeHtml(p.name)+'</span>').join(' ')+'</div><p>방장이 게임을 시작하면 자동 진행됩니다.</p></div>';controls()}else render()}});hostConn.on('close',()=>toast('호스트 연결이 종료됐습니다'));hostConn.on('error',()=>toast('방 접속 실패'))});peer.on('error',()=>toast('방을 찾지 못했거나 중계 서버에 연결할 수 없습니다'))}
window.addEventListener('beforeunload',()=>peer?.destroy());let url=new URLSearchParams(location.search);if(url.get('room'))enter('join');else home();
})();
</script></body></html>
